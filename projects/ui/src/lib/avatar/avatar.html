<button
  mat-icon-button
  type="button"
  class="tp-avatar"
  [style.--tp-avatar-size.px]="size()"
  [attr.aria-label]="alt()"
  [disabled]="disabled()"
  [disableRipple]="true"
  [matTooltip]="tooltipTitle() || ''"
  [matTooltipDisabled]="!tooltipTitle()"
  (click)="onClick.emit($event)"
>
  @if (hasImage()) {
    <img class="tp-avatar__image" [src]="src()!" [alt]="alt()" (error)="handleImageError()" />
  } @else {
    <span class="tp-icon material-symbols-outlined tp-avatar__fallback" aria-hidden="true">person</span>
  }
</button>
