<button
  mat-button
  type="button"
  class="tp-text-button"
  [disabled]="disabled()"
  (click)="onClick.emit($event)"
  [matTooltip]="tooltipTitle() || ''"
  [matTooltipDisabled]="!tooltipTitle()"
  [ngClass]="textButtonClass()"
  [ngStyle]="textButtonStyle()"
>
  <ng-content></ng-content>
</button>
