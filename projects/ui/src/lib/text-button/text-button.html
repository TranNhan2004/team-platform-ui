<button
  mat-button
  type="button"
  class="tp-text-button"
  [disabled]="disabled()"
  (click)="onClick.emit($event)"
  [matTooltip]="tooltipTitle() || ''"
  [matTooltipDisabled]="!tooltipTitle()"
  [ngClass]="textButtonClass()"
  [ngStyle]="textButtonStyle()"
>
  <span
    class="tp-text-button__content"
    [class.tp-text-button__content--align-start]="contentAlignment() === 'start'"
    [class.tp-text-button__content--align-end]="contentAlignment() === 'end'"
  >
    <ng-content></ng-content>
  </span>
</button>
