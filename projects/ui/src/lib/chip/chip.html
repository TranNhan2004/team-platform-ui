<mat-chip-set>
  <mat-chip
    class="tp-chip"
    [matTooltip]="tooltipTitle() || ''"
    [matTooltipDisabled]="!tooltipTitle()"
    [disableRipple]="true"
    [ngClass]="chipClass()"
    [ngStyle]="chipStyle()"
  >
    <span class="tp-chip__content">
      <ng-content></ng-content>
    </span>
  </mat-chip>
</mat-chip-set>
