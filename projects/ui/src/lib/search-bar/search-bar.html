<div class="tp-search-bar" [style.width]="width()" [style.max-width]="maxWidth()">
  <span class="tp-icon material-symbols-outlined tp-search-bar__icon" aria-hidden="true">search</span>
  <input
    matInput
    class="tp-search-bar__input"
    type="search"
    [formField]="searchField"
    [placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel()"
  />
</div>
