<button
  mat-icon-button
  type="button"
  class="tp-bell-notification"
  [attr.aria-label]="accessibleLabel()"
  [disabled]="disabled()"
  [matBadge]="badgeText()"
  [matBadgeHidden]="notificationCount() === 0"
  matBadgeColor="warn"
  matBadgePosition="above after"
  [matTooltip]="tooltipTitle() || ''"
  [matTooltipDisabled]="!tooltipTitle()"
  (click)="onClick.emit($event)"
>
  <mat-icon aria-hidden="true">notifications_none</mat-icon>
</button>
