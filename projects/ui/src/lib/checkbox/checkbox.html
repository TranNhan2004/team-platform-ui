<mat-checkbox
  class="tp-checkbox"
  [checked]="checked()"
  [disabled]="disabled()"
  [indeterminate]="indeterminate()"
  [required]="required()"
  [attr.name]="name() || null"
  [value]="nativeValue()"
  [attr.aria-label]="ariaLabel() || null"
  [tabIndex]="tabIndex()"
  [ngStyle]="selectedColorStyle()"
  (change)="updateChecked($event)"
>
  <ng-content></ng-content>
</mat-checkbox>
