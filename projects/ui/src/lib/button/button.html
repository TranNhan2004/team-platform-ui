<ng-template #buttonContent>
  <span class="tp-button__content">
    <ng-content></ng-content>
  </span>
</ng-template>

@switch (variant()) {
  @case ('outlined') {
    <button
      mat-stroked-button
      [matTooltip]="tooltipTitle() || ''"
      [matTooltipDisabled]="!tooltipTitle()"
      class="tp-button"
      [disabled]="disabled()"
      (click)="onClick.emit($event)"
      [ngClass]="buttonClass()"
      [ngStyle]="buttonStyle()"
    >
      <ng-container [ngTemplateOutlet]="buttonContent"></ng-container>
    </button>
  }
  @case ('tonal') {
    <button
      mat-stroked-button
      [matTooltip]="tooltipTitle() || ''"
      [matTooltipDisabled]="!tooltipTitle()"
      class="tp-button"
      [disabled]="disabled()"
      (click)="onClick.emit($event)"
      [ngClass]="buttonClass()"
      [ngStyle]="buttonStyle()"
    >
      <ng-container [ngTemplateOutlet]="buttonContent"></ng-container>
    </button>
  }
  @default {
    <button
      mat-flat-button
      [matTooltip]="tooltipTitle() || ''"
      [matTooltipDisabled]="!tooltipTitle()"
      class="tp-button"
      [disabled]="disabled()"
      (click)="onClick.emit($event)"
      [ngClass]="buttonClass()"
      [ngStyle]="buttonStyle()"
    >
      <ng-container [ngTemplateOutlet]="buttonContent"></ng-container>
    </button>
  }
}
