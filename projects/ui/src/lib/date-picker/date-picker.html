<input
  class="tp-date-picker__input"
  tabindex="-1"
  aria-hidden="true"
  [matDatepicker]="picker"
  [value]="value()"
  [min]="minDate()"
  [max]="maxDate()"
  [disabled]="disabled()"
  (dateChange)="selectDate($event.value)"
/>

<button
  mat-icon-button
  type="button"
  class="tp-date-picker__trigger"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  (click)="open()"
>
  <mat-icon aria-hidden="true">calendar_today</mat-icon>
</button>

<mat-datepicker
  #picker
  startView="month"
  panelClass="tp-date-picker-calendar"
  [startAt]="startAt()"
></mat-datepicker>
