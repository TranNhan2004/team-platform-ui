<section class="component-section" aria-labelledby="dialog-title">
  <div class="component-section__heading">
    <h2 id="dialog-title">Dialog</h2>
    <code>&lt;tp-dialog&gt;</code>
  </div>
  <tp-button (click)="demoDialog.openDialog()">Open dialog</tp-button>
  <tp-dialog #demoDialog title="Example dialog">
    <p>
      This dialog demonstrates projected content, actions, backdrop closing, and Escape closing.
    </p>
    <div dialog-actions>
      <tp-text-button (click)="demoDialog.closeDialog()">Cancel</tp-text-button>
      <tp-button (click)="demoDialog.closeDialog()">Confirm</tp-button>
    </div>
  </tp-dialog>
</section>
