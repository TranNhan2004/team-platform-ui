<section class="component-section" aria-labelledby="avatars-title">
  <div class="component-section__heading">
    <h2 id="avatars-title">Avatar</h2>
    <code>&lt;tp-avatar&gt;</code>
  </div>
  <div class="example-row">
    <tp-avatar tooltipTitle="Default fallback"></tp-avatar>
    <tp-avatar [size]="32" tooltipTitle="Small fallback"></tp-avatar>
    <tp-avatar [size]="56" tooltipTitle="Large fallback"></tp-avatar>
    <tp-avatar src="/favicon.ico" alt="Angular logo avatar" tooltipTitle="Image avatar"></tp-avatar>
    <tp-avatar [disabled]="true" tooltipTitle="Disabled avatar"></tp-avatar>
  </div>
</section>
