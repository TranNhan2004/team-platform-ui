<section class="component-section" aria-labelledby="input-singleselect-title">
  <div class="component-section__heading">
    <h2 id="input-singleselect-title">Input single select</h2>
    <code>&lt;tp-input-singleselect&gt;</code>
  </div>
  <div class="input-grid">
    <tp-input-singleselect
      title="Project"
      placeholder="Choose a project"
      [options]="projectOptions"
      [displayWith]="displayProject"
      [(value)]="selectedProject"
      hint="Choose one existing project"
    ></tp-input-singleselect>
    <tp-input-singleselect
      title="Loading projects"
      [loading]="true"
      loadingMessage="Fetching projects..."
    ></tp-input-singleselect>
    <tp-input-singleselect
      title="Required project"
      [options]="projectOptions"
      [displayWith]="displayProject"
      [required]="true"
    ></tp-input-singleselect>
    <tp-input-singleselect
      title="Required project 2"
      [options]="projectOptions"
      [displayWith]="displayProject"
      [required]="true"
    ></tp-input-singleselect>
    <tp-input-singleselect
      title="Empty projects"
      noResultsMessage="No projects are available"
    ></tp-input-singleselect>
  </div>
  <p>
    Selected project: <strong>{{ selectedProjectText() }}</strong>
  </p>
</section>
