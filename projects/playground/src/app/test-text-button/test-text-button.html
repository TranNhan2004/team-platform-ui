<section class="component-section" aria-labelledby="text-buttons-title">
  <div class="component-section__heading">
    <h2 id="text-buttons-title">Text button</h2>
    <code>&lt;tp-text-button&gt;</code>
  </div>

  <div class="example-group">
    <h3>Colors</h3>
    <div class="example-row">
      <tp-text-button color="gray">Gray</tp-text-button>
      <tp-text-button color="black">Black</tp-text-button>
      <span class="dark-example">
        <tp-text-button color="white">White</tp-text-button>
      </span>
    </div>
  </div>

  <div class="example-group">
    <h3>Dimensions and states</h3>
    <div class="example-row">
      <tp-text-button height="32px" width="72px">32 px</tp-text-button>
      <tp-text-button height="40px" width="96px">40 px</tp-text-button>
      <tp-text-button height="48px" width="120px">48 px</tp-text-button>
      <tp-text-button afterPressEffect="underline">Pressed underline</tp-text-button>
      <tp-text-button [disabled]="true">Disabled</tp-text-button>
    </div>
    <tp-text-button width="100%">Full-width text button</tp-text-button>
  </div>

  <div class="example-group">
    <h3>Hover and press shapes</h3>
    <div class="example-row">
      <tp-text-button
        pressEffectShape="circle"
        width="var(--tp-control-height-md)"
        tooltipTitle="Circle"
      >
        <span class="tp-icon material-symbols-outlined" aria-hidden="true">add</span>
      </tp-text-button>
      <tp-text-button pressEffectShape="elip">Elip</tp-text-button>
      <tp-text-button pressEffectShape="rect">Rect</tp-text-button>
      <tp-text-button pressEffectShape="rect" hoverShape="elip">
        Hover elip, press rect
      </tp-text-button>
    </div>
  </div>
</section>
