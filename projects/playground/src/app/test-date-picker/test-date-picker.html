<section class="component-section" aria-labelledby="date-picker-title">
  <div class="component-section__heading">
    <h2 id="date-picker-title">Date picker</h2>
    <code>&lt;tp-date-picker&gt;</code>
  </div>
  <div class="example-row">
    <span>Icon-only:</span>
    <tp-date-picker
      [value]="calendarDate()"
      (valueChange)="calendarDate.set($event)"
    ></tp-date-picker>
  </div>
</section>
